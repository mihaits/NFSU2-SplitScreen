[MAIN]
; Split screen is started from the main menu "Split-Screen" option (right after Quick Race);
; the number of players (2-6) is chosen on the race options screen.
; 2 players: 0 = top / bottom, 1 = left / right (also for two monitors side by side in one span).
VerticalSplit = 0
; 1 = write NFSU2SplitScreen.log next to the plugin and enable the debug mailbox (troubleshooting / development).
Debug = 0

[INPUT]
; 1 = rumble on each player's own pad, as on the console version (each player's Feedback option turns theirs off).
Rumble = 1
; Rumble strength in percent.
RumbleStrength = 100
; 1 = DualSense and DualShock 4 pads work without DS4Windows (off automatically while DS4Windows exposes its virtual Xbox pad;
;     DS4Windows open but stopped doesn't matter).
;     They are gamepads like XInput pads, rumble included; USB and Bluetooth.
NativeDualSense = 1
; DualSense rumble mode: 0 = auto (by firmware), 1 = old firmware mode, 2 = new firmware mode.
DualSenseRumbleMode = 0

[LIGHTS]
; DualSense player LEDs show the player number (the controlling pad shows 1, other DualSense pads flash all 5).
PlayerLeds = 1
; DualSense lightbar while racing: engine rpm green to red, flashing red at the shift point, blue while nitrous burns.
; DualShock 4 lightbar: the player's colour, the start lights and the podium colours.
; 0 = off.
Lightbar = 1
; Lightbar brightness in percent.
LightbarBrightness = 100
; DualSense adaptive triggers: resistance, buzz at the grip limit (braking, wheelspin), rev limiter and a nitrous kick. 0 = free.
; Xbox One / Series impulse triggers (Forza Horizon style): they buzz with wheelspin and brake slip. Each player can
; change it in the pause options.
AdaptiveTriggers = 1
; Trigger effect strength in percent.
TriggerStrength = 100

[AUDIO]
; 1 = in split races each player's own car sounds (PadSpeakerSounds) play on the speaker of their DualSense (Bluetooth or
;     USB, NativeDualSense) instead of the PC speakers; everything else stays on the PC. Players on other pads keep
;     their car on the PC. The mute button switches it off and on during a race. With more than 2 Bluetooth DualSense
;     players the speakers start off (one Bluetooth adapter can't carry them all); the mute button turns a player's on.
;     USB pads don't count, and headphones in a pad's jack are muted while its speaker plays.
PadSpeakers = 1
; Volume on the pad speakers in percent.
PadSpeakerGain = 400
; The car's sounds that go to the pad, by name in the game's sound bank (the engine itself always does). Others you can
; add: FX_ROADNOISE, FX_ROADNOISE_TRANS (road rumble), FX_WIND (wind rush), FX_WIND_Weather, FX_Weather (rain).
PadSpeakerSounds = CAR, CAR_SWTN, CAR_Sputter, FX_TURBO_01, FX_SHIFTING_01, FX_NITROUS, FX_PURGE, FX_SKID, FX_Scrape, AEMS_StichCollision

[HUD]
; 1 = every player gets their car's single-player gauges (tachometer, boost, nitrous; single-player drag HUD in drag).
SinglePlayerGauges = 1
; Size of those gauges in percent of the single-player layout (non-drag races).
GaugeScalePercent = 60

[FREERUN]
; Default of split-screen Free Run's Start row: 0 Airport, 1 City Core, 2 Beacon Hill, 3 Jackson Heights, 4 Coal Harbor,
; 5 Random (a district), 6 Speedway Industrial, 7 Speedway Drift Pad, 8 Speedway Airport, 9 Stadium (drift),
; 10 Vacant Lot (drift).
Start = 0

[DEBUG]
; Default of the Players row: 2 + ExtraPlayers (0..4).
ExtraPlayers = 0
; Default of the Opponents row (AI racers; at most 6 racers in all, 4 in drag).
Opponents = 0
