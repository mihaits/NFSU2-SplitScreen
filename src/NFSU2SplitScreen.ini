[MAIN]
; Split screen is started from the main menu "Split-Screen" option (right after Quick Race);
; the number of players (2-4) is chosen on the race options screen.
; 1 = write NFSU2SplitScreen.log next to the plugin and enable the debug mailbox (troubleshooting / development).
Debug = 0

[INPUT]
; 1 = connected XInput pads (Xbox pads, PlayStation pads through DS4Windows, ...) are used as the game's gamepads.
;     In split screen each player presses START on their own pad to join; outside split the last pad used drives.
XInputPads = 1
; 1 = hide the real DirectInput game controllers so they don't take the game's controller slots.
HideDirectInputControllers = 1
; 1 = rumble on each player's own pad, as on the console version (each player's Feedback option turns theirs off).
Rumble = 1
; Rumble strength in percent.
RumbleStrength = 100

[HUD]
; 1 = every player gets their car's single-player gauges (tachometer, boost, nitrous; single-player drag HUD in drag).
SinglePlayerGauges = 1
; Size of those gauges in percent of the single-player layout (non-drag races).
GaugeScalePercent = 60

[DEBUG]
; Default of the Players row: 2 + ExtraPlayers (0..2).
ExtraPlayers = 0
; 1 = keyboard Enter can also join player 2 (that player then has no pad). For testing only.
KeyboardJoinP2 = 0
